# Dockerized Rung: FalkorDB + FastAPI backend + Next.js frontend.
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6380:6379"     # FalkorDB (Redis protocol)
      - "3100:3000"     # FalkorDB Browser
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_GRAPH: rung:kind-graphhacks
      RUNG_SEED_SNAPSHOT: /app/data/demo-snapshot.json
      # The agent's model key. Compose reads .env automatically; empty is fine until the agent lands.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      falkordb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend