# Dockerized Rung: FalkorDB + FastAPI backend + Next.js frontend.
services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    ports:
      - "6380:6379"     # FalkorDB (Redis protocol)
      - "3100:3000"     # FalkorDB Browser
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_GRAPH: rung:kind-graphhacks
      RUNG_SEED_SNAPSHOT: /app/data/demo-snapshot.json
      # Model keys come from .env at the repo root (compose reads it for
      # substitution; the file is git-ignored). Empty is fine — chat falls
      # back to the offline keyword answerer.
      BEDROCK_API_KEY: "${BEDROCK_API_KEY:-}"
      BEDROCK_REGION: "${BEDROCK_REGION:-us-east-1}"
      BEDROCK_MODEL_ID: "${BEDROCK_MODEL_ID:-amazon.nova-lite-v1:0}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    depends_on:
      falkordb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend