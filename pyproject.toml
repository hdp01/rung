[project]
name = "rung"
version = "0.1.0"
description = "An agent that reasons over Kubernetes privilege-escalation paths in a graph"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.0.9",
    "kubernetes>=31.0.0",
    "anthropic>=0.69.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
]

[project.scripts]
rung = "rung.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rung"]

[tool.ruff]
line-length = 100
