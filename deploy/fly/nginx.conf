# Single public entrypoint for the Fly machine (:8080 -> HTTPS on Fly).
# API paths go to FastAPI; everything else is the Next.js frontend, so the
# UI is served from the same host it talks to.
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 64m;

        # Every route app/main.py exposes (+ docs).  Keep in sync when the
        # API grows.
        location ~ ^/(health|stats|composition|graph|paths|findings|snapshots|exceptions|tenants|ingest|compare|ask|docs|redoc|openapi\.json)(/|$|\?) {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            # /ask streams SSE; never buffer it.
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
